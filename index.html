<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Cash App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; }
.container { max-width:600px; margin:20px auto; background:#fff; padding:20px; border-radius:12px; }
h2 { margin-top:30px; }
input, select, button {
width:100%; padding:10px; margin:6px 0;
border-radius:6px; border:1px solid #ccc;
}
button { background:#2e7d32; color:#fff; border:none; font-size:16px; }
.box { background:#fafafa; padding:10px; border-radius:6px; margin-top:10px; }
.log { font-size:14px; margin-top:4px; }
</style>
</head>
<body>
<div class="container">
<h1>Restaurant Cash App</h1>
<h2>Branch & Cashier</h2>
<select><option>Main Branch</option></select>
<input placeholder="Cashier name">
<h2>Cash Drawer</h2>
<input type="number" placeholder="$20 bills">
<input type="number" placeholder="$10 bills">
<input type="number" placeholder="$5 bills">
<h3>Extra Change (Backup)</h3>
<input type="number" placeholder="Extra cash amount">
<button>Calculate</button>
<div class="box">
<p><strong>Cash Income Today:</strong> $____</p>
</div>
<h2>Deposit</h2>
<input placeholder="Customer name">
<input type="number" placeholder="Deposit amount">
<select>
<option>Pending</option>
<option>Applied</option>
<option>Refunded</option>
<option>Cancelled</option>
</select>
<button>Add Deposit</button>
<h2>Refund</h2>
<input placeholder="Reason">
<input type="number" placeholder="Amount">
<select><option>Cash</option><option>Card</option></select>
<button>Save Refund</button>
<p style="font-size:12px;color:#777">Offline ready ✔</p>
</div>
<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
